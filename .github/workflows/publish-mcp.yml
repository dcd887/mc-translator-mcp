name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server.json', 'package.json', 'pyproject.toml']

permissions:
  contents: read
  id-token: write        # OIDC：给 mcp-publisher 用，无需本地登录

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          ARCH=amd64
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_${ARCH}.tar.gz" | tar xz
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --version

      - name: Validate server.json
        run: mcp-publisher validate

      - name: Login (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish
        run: mcp-publisher publish
