[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mc-translator-mcp"
version = "0.1.0"
description = "MCP tool for automatically translating Minecraft mods to Chinese (zh_cn)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "mc-translator-mcp", email = ""}]
dependencies = [
    "mcp>=1.0.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
mc-translator-mcp = "mc_translator_mcp.mcp_server:main"

[tool.setuptools.packages.find]
include = ["mc_translator_mcp*"]

[tool.ruff]
line-length = 120
target-version = "py310"
